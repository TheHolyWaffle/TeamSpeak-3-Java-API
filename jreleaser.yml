# release-please owns versions, notes, the version tag and the GitHub release; JReleaser only signs
# the staged publication and deploys it to Maven Central. Snapshots are never published.
project:
  name: teamspeak3-api
  description: A Java wrapper of the TeamSpeak ServerQuery API
  license: MIT
  authors:
    - TheHolyWaffle
    - rogermb
  links:
    homepage: https://github.com/TheHolyWaffle/TeamSpeak-3-Java-API
  languages:
    java:
      groupId: com.github.theholywaffle
      artifactId: teamspeak3-api
release:
  github:
    owner: TheHolyWaffle
    name: TeamSpeak-3-Java-API
    skipTag: true
    skipRelease: true
signing:
  active: RELEASE
  pgp:
    armored: true
    mode: MEMORY
    verify: true
deploy:
  maven:
    mavenCentral:
      central:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        namespace: com.github.theholywaffle
        # Rejects a bundle without sources, Javadoc, signatures or the required POM metadata.
        applyMavenCentralRules: true
        stagingRepositories:
          - build/staging-deploy
