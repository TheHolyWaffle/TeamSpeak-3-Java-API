name: Bug report
description: A reproducible problem in the library.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Questions belong in [Discussions](https://github.com/TheHolyWaffle/TeamSpeak-3-Java-API/discussions/categories/q-a), and vulnerabilities in a [private report](https://github.com/TheHolyWaffle/TeamSpeak-3-Java-API/security/advisories/new).
        Everything you enter here is public. Remove passwords, privilege keys, API keys, host names, IP addresses, nicknames, unique identifiers and message contents you do not want to share.
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: The `teamspeak3-api` version, or the commit if you built it from source.
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version and OS
      description: The first line of `java -version`, and the operating system.
      placeholder: openjdk version "25.0.1", Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: TeamSpeak server version
      description: From `api.instance().version()` or the server log, plus how it runs (Docker image, host OS).
      placeholder: 3.13.8 (Linux), official Docker image
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - Raw TCP
        - SSH
        - Both
        - Not related to the query connection (for example file transfers only)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal program or the calls you make, with your `TS3Config` settings. Start from an [example](https://github.com/TheHolyWaffle/TeamSpeak-3-Java-API/tree/master/src/example/java/com/github/theholywaffle/teamspeak3/example) if you can.
      render: java
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What you expected, what happened instead, and any exception with its full stack trace.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Communications log
      description: |
        Enable `setEnableCommunicationsLogging(true)` (or `TS3_COMMUNICATIONS_LOGGING=true` for the examples) with an SLF4J provider logging DEBUG, then paste the relevant lines.
        Passwords, privilege keys, API keys and file transfer keys are redacted automatically; other data such as IP addresses, nicknames and messages is not.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I use a [supported version](https://github.com/TheHolyWaffle/TeamSpeak-3-Java-API/blob/master/SECURITY.md#supported-versions) and Java 25 or newer for 2.x.
          required: true
        - label: I removed secrets and personal data from everything above.
          required: true
