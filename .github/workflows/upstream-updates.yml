name: Upstream update detection

on:
  schedule:
    - cron: '17 5 * * 4' # Weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ts3_image:
    name: Detect a newer TS3 server image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pinned: ${{ steps.image.outputs.pinned }}
      candidate: ${{ steps.image.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the pin with the newest official TeamSpeak 3 image
        id: image
        run: bash .github/scripts/ts3-image-candidate.sh | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  ts3_compatibility:
    name: Candidate TS3 image
    needs: ts3_image
    if: ${{ needs.ts3_image.outputs.candidate != needs.ts3_image.outputs.pinned }}
    uses: ./.github/workflows/compatibility.yml
    with:
      ts3-image: ${{ needs.ts3_image.outputs.candidate }}

