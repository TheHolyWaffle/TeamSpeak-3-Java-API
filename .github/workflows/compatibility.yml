name: ServerQuery compatibility

on:
  workflow_call:
    inputs:
      ts3-image:
        description: Candidate digest-pinned TS3 image to test instead of the pin
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ts3-image:
        description: Candidate digest-pinned TS3 image (teamspeak:X.Y.Z@sha256:...); empty uses the pin
        type: string
        default: ''
  schedule:
    - cron: '23 6 * * 1' # Weekly verification of pinned TS3 compatibility.

permissions:
  contents: read

jobs:
  compatibility:
    name: Docker compatibility (Java 25, Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Use the candidate TS3 image as its update PR would
        if: ${{ inputs.ts3-image != '' }}
        env:
          TS3_IMAGE: ${{ inputs.ts3-image }}
        run: bash .github/scripts/use-ts3-image.sh "$TS3_IMAGE"
      - name: Require Docker and record image architectures
        run: |
          docker version
          docker info --format '{{.Architecture}}'
          docker buildx imagetools inspect "$(sed -n 's/^FROM //p' src/test/resources/teamspeak3/Dockerfile)"
      - name: Run required authenticated ServerQuery suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ci-logs
          ./mvnw -B -ntp -Pintegration verify 2>&1 | tee target/ci-logs/compatibility.log
      - name: Upload exact versions, negotiation evidence and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverquery-compatibility
          path: |
            target/compatibility/
            target/ci-logs/
            target/failsafe-reports/
            target/surefire-reports/
            target/site/jacoco-it/
          if-no-files-found: error
          retention-days: 14
