name: Release

# release-please keeps a release PR up to date with every releasable commit on master. Merging it
# creates the version tag and GitHub release; the publish job then deploys that exact tag to Central
# once a maintainer approves the protected release environment.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release_please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A dedicated fine-grained PAT, so the release PR receives normal pull_request CI events.
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: gradle jreleaserDeploy
    needs: release_please
    if: ${{ needs.release_please.outputs.created == 'true' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Sigstore certificate for the provenance attestation.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      # No build cache in the release job: everything published is built from the tag.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Build, verify and stage the tagged version
        env:
          VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          # The provenance names the triggering commit; it must be the tagged one that is built.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -qx "version=$VERSION" gradle.properties
          ./gradlew build publish --no-build-cache
      - name: Attest build provenance of the staged artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/staging-deploy/com/github/theholywaffle/teamspeak3-api/*/teamspeak3-api-*.pom
            build/staging-deploy/com/github/theholywaffle/teamspeak3-api/*/teamspeak3-api-*.module
            build/staging-deploy/com/github/theholywaffle/teamspeak3-api/*/teamspeak3-api-*.jar
      # The same policy a consumer verifies with; JReleaser uploads exactly these files plus signatures.
      - name: Require verifiable provenance before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for file in build/staging-deploy/com/github/theholywaffle/teamspeak3-api/*/teamspeak3-api-*.{pom,module,jar}; do
            gh attestation verify "$file" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/master --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Sign, validate and deploy through the Central Portal
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # The public key follows from the private key, so it needs no secret of its own.
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$JRELEASER_GPG_SECRET_KEY"
          JRELEASER_GPG_PUBLIC_KEY=$(gpg --armor --export)
          export JRELEASER_GPG_PUBLIC_KEY
          ./gradlew jreleaserDeploy --no-build-cache
      - name: Retain the deployment state
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.release_please.outputs.version }}
          path: |
            build/staging-deploy/
            build/jreleaser/output.properties
            build/jreleaser/trace.log
          if-no-files-found: ignore
          retention-days: 30
