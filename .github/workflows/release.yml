name: Explicit release publication

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full SHA of the reviewed release-please merge commit at master HEAD
        required: true
        type: string
      release_tag:
        description: Exact stable version tag (for example v2.0.0); JReleaser creates it
        required: true
        type: string
      action:
        description: Validate by default; publication and recovery are explicit
        required: true
        default: validate
        type: choice
        options: [validate, publish, resume-central, finish-github]
      deployment_id:
        description: Existing Portal deployment ID, required only for resume-central
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      commit: ${{ steps.approval.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Require the reviewed release commit and successful required CI
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ACTION: ${{ inputs.action }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_COMMIT" = "$(git rev-parse HEAD)"
          test "$RELEASE_COMMIT" = "$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          gh api "repos/$REPOSITORY/commits/$RELEASE_COMMIT/pulls" > target-pulls.json
          jq -e --arg sha "$RELEASE_COMMIT" 'any(.[];
            .merged_at != null and .merge_commit_sha == $sha and .base.ref == "master" and
            (.head.ref | startswith("release-please--")) and
            any(.labels[]; .name == "autorelease: pending"))' target-pulls.json
          gh api --paginate --slurp "repos/$REPOSITORY/commits/$RELEASE_COMMIT/check-runs" > target-checks.json
          jq -e '[.[].check_runs[] | select(.name == "CI required")] | max_by(.id) |
            .status == "completed" and .conclusion == "success"' target-checks.json
          case "$RELEASE_ACTION" in validate|publish|resume-central|finish-github) ;; *) exit 1 ;; esac
          if test "$RELEASE_ACTION" = resume-central; then
            [[ "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          else
            test -z "$DEPLOYMENT_ID"
          fi
          # Existing tags are permitted only when they already identify this commit.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          fi
          # Never repeat a completed GitHub release (or overwrite its artifacts).
          gh api "repos/$REPOSITORY/releases" --paginate \
            --jq '.[].tag_name' > target-releases.txt
          ! grep -Fxq "$RELEASE_TAG" target-releases.txt
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Validate approved version and extract release-specific notes unchanged
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p target
          ./mvnw -B -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -Doutput=target/release-version.txt
          bash .github/scripts/release-metadata.sh "$(cat target/release-version.txt)" "$RELEASE_TAG"

  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish the approved release (protected environment)
    needs: [validate, verify]
    if: ${{ needs.validate.result == 'success' && needs.verify.result == 'success' && inputs.action != 'validate' }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # JReleaser alone creates the version tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Recheck immutable inputs after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_COMMIT" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          mkdir -p target
          ./mvnw -B -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -Doutput=target/release-version.txt
          bash .github/scripts/release-metadata.sh "$(cat target/release-version.txt)" "$RELEASE_TAG"
      - name: Package the normal library into a local repository
        if: ${{ inputs.action != 'finish-github' }}
        run: ./mvnw -B -ntp -Pcentral-staging deploy
      - name: Sign, validate and deploy through Central Portal
        if: ${{ inputs.action != 'finish-github' }}
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          SIGNING_SECRET_KEY: ${{ secrets.RELEASE_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_ACTION: ${{ inputs.action }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME"
          test -n "$JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD"
          test -n "$SIGNING_PUBLIC_KEY"
          test -n "$SIGNING_SECRET_KEY"
          test -n "$JRELEASER_GPG_PASSPHRASE"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          chmod 700 "$keydir"
          umask 077
          printf '%s' "$SIGNING_PUBLIC_KEY" > "$keydir/public.asc"
          printf '%s' "$SIGNING_SECRET_KEY" > "$keydir/secret.asc"
          export JRELEASER_GPG_PUBLIC_KEY="$keydir/public.asc"
          export JRELEASER_GPG_SECRET_KEY="$keydir/secret.asc"
          if test "$RELEASE_ACTION" = resume-central; then
            # Read-only status check: reject another namespace/version or a completed deployment.
            printf 'Authorization: Bearer %s\n' "$(printf '%s:%s' \
              "$JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME" "$JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD" \
              | base64 | tr -d '\r\n')" > "$keydir/auth.headers"
            curl --fail --silent --show-error --request POST --header "@$keydir/auth.headers" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" \
              --output target/portal-status.json
            bash .github/scripts/check-portal-deployment.sh "$DEPLOYMENT_ID" \
              "$(cat target/release-version.txt)" target/portal-status.json
            export JRELEASER_MAVENCENTRAL_CENTRAL_STAGE=PUBLISH
            export JRELEASER_MAVENCENTRAL_CENTRAL_DEPLOYMENT_ID="$DEPLOYMENT_ID"
          fi
          ./mvnw -B -ntp jreleaser:deploy
          cp target/jreleaser/output.properties target/jreleaser/deployment-output.properties
      - name: Require Central availability before creating the GitHub release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(cat target/release-version.txt)
          curl --fail --silent --show-error --retry 10 --retry-delay 30 --retry-all-errors \
            "https://repo.maven.apache.org/maven2/com/github/theholywaffle/teamspeak3-api/$version/teamspeak3-api-$version.pom" \
            --output target/published.pom
          ./mvnw -B -ntp jreleaser:release -Djreleaser.config.file=jreleaser-github.yml
      - name: Retain recovery state without signing material
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-state-${{ github.run_id }}
          path: |
            target/jreleaser/output.properties
            target/jreleaser/deployment-output.properties
            target/staging-deploy/
            target/release-notes.md
          if-no-files-found: ignore
          retention-days: 30
