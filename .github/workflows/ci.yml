name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited]
  schedule:
    - cron: '23 6 * * 1' # Weekly verification of pinned TS3 compatibility.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, test and check the library, sources, Javadoc and API
        run: ./gradlew build
      - name: Account for every API difference from 1.3.1
        run: bash .github/scripts/api-accounting.sh build/japicmp/api-compatibility.diff docs/api-differences-2.0.md
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            build/reports/
            build/japicmp/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: ServerQuery compatibility (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run the authenticated ServerQuery suite against the pinned TS3 image
        run: ./gradlew integrationTest
      - name: Upload server versions, negotiation evidence and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverquery-compatibility
          path: |
            build/compatibility/
            build/reports/
          if-no-files-found: error
          retention-days: 14

  publication:
    name: Publication rehearsal (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Sign and validate the Central bundle with a disposable key
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase rehearsal --quick-generate-key 'CI rehearsal <rehearsal@example.invalid>' rsa3072 sign 1d
          JRELEASER_GPG_PUBLIC_KEY=$(gpg --armor --export)
          JRELEASER_GPG_SECRET_KEY=$(gpg --batch --pinentry-mode loopback --passphrase rehearsal --armor --export-secret-keys)
          export JRELEASER_GPG_PUBLIC_KEY JRELEASER_GPG_SECRET_KEY JRELEASER_GPG_PASSPHRASE=rehearsal
          export JRELEASER_GITHUB_TOKEN=unused JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME=unused JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD=unused
          ./gradlew jreleaserDeploy -PdryRun -Pversion=0.0.0
      - name: Run Maven and Gradle consumers against the staged artifacts
        run: bash .github/scripts/consumer-check.sh 0.0.0
      - name: Require a clean rebuild to reproduce every artifact
        run: |
          staged=build/staging-deploy/com/github/theholywaffle/teamspeak3-api/0.0.0
          cp -R "$staged" "$RUNNER_TEMP/first"
          ./gradlew clean publish --no-build-cache -Pversion=0.0.0
          diff -r -x '*.asc' "$RUNNER_TEMP/first" "$staged"
      - name: Stage this commit's snapshot
        run: |
          rm -rf build/staging-deploy
          ./gradlew publish
      - name: Upload the snapshot as a Maven repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-repository
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 14

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  dependencies:
    name: Dependency graph and review
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Dependency snapshot submission; fork PRs receive a read-only token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
      # Submits the resolved transitive graph, which Dependabot alerts and dependency review use.
      - name: Submit the resolved Gradle dependency graph
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Reject vulnerable dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  release_intent:
    name: Release intent
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci

  required:
    name: CI required
    if: ${{ always() }}
    needs: [build, integration, publication, workflows, dependencies, release_intent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success" or . == "skipped")' <<< "$RESULTS"
