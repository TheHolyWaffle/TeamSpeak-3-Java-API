name: Maven CI

on:
  push:
    branches: [master, modernization/2.0]
  pull_request:
    branches: [master, modernization/2.0]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  release_intent:
    name: Release intent
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci

  required:
    name: CI required
    if: ${{ always() }}
    needs: [verify, compatibility, release_intent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable verification job to succeed
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          INTENT_RESULT: ${{ needs.release_intent.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$INTENT_RESULT" = success || test "$INTENT_RESULT" = skipped
