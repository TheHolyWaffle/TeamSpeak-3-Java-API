name: Maven CI

on:
  push:
    branches: [master, modernization/2.0]
  pull_request:
    branches: [master, modernization/2.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release_intent:
    name: Release intent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install release tooling
        run: |
          python3 -m pip install -r .github/scripts/requirements.txt
          python3 .github/scripts/install-changie.py
      - name: Validate fragments and PR intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 .github/scripts/release.py validate --base "$BASE_SHA" --head-branch "$HEAD_BRANCH"
          else
            python3 .github/scripts/release.py validate
          fi
      - name: Rehearse release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  required:
    name: CI required
    if: ${{ always() }}
    needs: [verify, release_intent]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          INTENT_RESULT: ${{ needs.release_intent.result }}
        run: test "$BUILD_RESULT" = success && test "$INTENT_RESULT" = success
