name: Dependencies

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency graph and review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Dependency snapshot submission; fork PRs receive a read-only token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # GitHub's own pom.xml parsing sees direct dependencies only; this submits the resolved
      # transitive graph, which Dependabot alerts and dependency review then use.
      - name: Submit the resolved Maven dependency graph
        if: ${{ github.event_name == 'push' || !github.event.pull_request.head.repo.fork }}
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          snapshot-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          snapshot-ref: ${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
      - name: Reject vulnerable dependency changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
