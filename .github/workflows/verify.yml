name: Verify artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '27'] # Java 25 baseline and newer GA, never an EA build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Verify library
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ci-logs
          ./mvnw -B -ntp verify 2>&1 | tee target/ci-logs/library.log
      - name: Verify standalone, sources and Javadoc artifacts
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp -Pfull verify 2>&1 | tee target/ci-logs/full.log
      - name: Upload failure reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-reports-java-${{ matrix.java }}
          path: |
            target/ci-logs/
            target/surefire-reports/
            target/failsafe-reports/
            target/reports/
            target/site/
          if-no-files-found: ignore
          retention-days: 7

  publication_bundle:
    name: Validate publication bundle (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Test release metadata gates
        run: bash .github/scripts/test-release-metadata.sh
      - name: Create a synthetic release solely for local validation
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            -DnewVersion=0.0.0 -DgenerateBackupPoms=false -DupdateBuildOutputTimestampPolicy=never
          mkdir -p target
          printf '## [0.0.0]\n\nNon-publishing CI rehearsal.\n' > target/release-notes.md
      - name: Stage and verify signatures with an ephemeral test key
        run: bash .github/scripts/release-rehearsal.sh
      - name: Upload validated bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-rehearsal
          path: |
            target/staging-deploy/
            target/jreleaser/deploy/
            target/release-notes.md
          if-no-files-found: error
          retention-days: 7
