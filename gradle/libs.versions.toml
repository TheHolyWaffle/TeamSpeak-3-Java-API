[versions]
bouncycastle = "1.86"
errorprone = "2.50.0"
jacoco = "0.8.15"
japicmp = "0.26.2"
junit = "6.1.3"
palantir-java-format = "2.99.0"
slf4j = "2.0.20"

[libraries]
bouncycastle-bom = { module = "org.bouncycastle:bc-jdk18on-bom", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on" }
gson = "com.google.code.gson:gson:2.14.0"
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
sshj = "com.hierynomus:sshj:0.41.1"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = "org.testcontainers:testcontainers:2.0.5"
# Build tools, listed here so Renovate updates them.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
jreleaser = "org.jreleaser:jreleaser-tool-provider:1.26.0"
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }
palantir-java-format = { module = "com.palantir.javaformat:palantir-java-format", version.ref = "palantir-java-format" }

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
spotless = "com.diffplug.spotless:8.10.4"
